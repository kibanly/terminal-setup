"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
[](fg:#414868)$username$hostname[](fg:#414868 bg:#7aa2f7)$directory\
($git_branch$git_status$git_state[ ](bg:#9ece6a)[](fg:#9ece6a)) \
$fill\
$status$cmd_duration$jobs$docker_context$php$nodejs$python$golang$rust$localip$time
$character"""

[fill]
symbol = ""
style = "bright-black"

[username]
show_always = true
style_user = "bg:#414868 fg:#c0caf5 bold"
style_root = "bg:#414868 fg:#f7768e bold"
format = "[ 󰀄 $user]($style)"

[hostname]
ssh_only = false
style = "bg:#414868 fg:#c0caf5 bold"
format = "[@$hostname ]($style)"

[directory]
style = "bg:#7aa2f7 fg:#1a1b26 bold"
repo_root_style = "bg:#7aa2f7 fg:#1a1b26 bold"
before_repo_root_style = "bg:#7aa2f7 fg:#1a1b26"
read_only = " 󰌾"
read_only_style = "bg:#7aa2f7 fg:#f7768e"
truncation_length = 10
truncate_to_repo = false
truncation_symbol = ""
format = "[ 󰉋 $path ]($style)[$read_only]($read_only_style)[](fg:#7aa2f7)"
repo_root_format = "[ 󰉋 $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)[$read_only]($read_only_style)[](fg:#7aa2f7 bg:#9ece6a)"

[git_branch]
symbol = "󰊢 "
style = "bg:#9ece6a fg:#1a1b26 bold"
format = "[ $symbol$branch]($style)"

[git_status]
style = "bg:#9ece6a fg:#1a1b26 bold"
format = "([ $all_status$ahead_behind]($style))"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
stashed = "*${count}"
staged = "+${count}"
modified = "!${count}"
renamed = "»${count}"
untracked = "?${count}"
deleted = "✘${count}"

[git_state]
style = "bg:#9ece6a fg:#1a1b26 bold"
format = "([ $state( $progress_current/$progress_total)]($style))"

[status]
disabled = false
symbol = "✘ "
style = "bold red"
format = "[$symbol$status]($style) "

[cmd_duration]
min_time = 0
show_milliseconds = true
style = "yellow"
format = "[󱎫 $duration]($style) "

[jobs]
symbol = "󰒓 "
style = "bold cyan"
number_threshold = 1
format = "[$symbol$number]($style) "

[docker_context]
symbol = "󰡨 "
style = "blue"
only_with_files = true
format = "[$symbol$context]($style) "

[php]
symbol = "󰌟 "
style = "purple"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "󰎙 "
style = "green"
format = "[$symbol$version]($style) "

[python]
symbol = "󰌠 "
style = "yellow"
format = "[$symbol$version]($style) "

[golang]
symbol = "󰟓 "
style = "cyan"
format = "[$symbol$version]($style) "

[rust]
symbol = "󱘗 "
style = "red"
format = "[$symbol$version]($style) "

[localip]
disabled = false
ssh_only = false
style = "bold yellow"
format = "[󰩟 $localipv4]($style) "

[time]
disabled = false
time_format = "%H:%M:%S"
style = "dimmed white"
format = "[󰥔 $time]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
