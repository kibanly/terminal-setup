# ═══════════════════════════════════════════════════════════════
#  tmux config (WSL2 + Windows Terminal · JetBrainsMono Nerd Font)
#
#  Everything is visible and clickable:
#    · top right: 󰍜 menu (Ctrl+a Space) and 󰋖 guide (Ctrl+a ?) buttons, with their keys;
#      after Ctrl+a or in copy mode the keys that work right now appear next to them
#    · click a tab, the session or a button · right-click a tab, the session or a pane
#    · Ctrl+a Space → quick menu   ·   Ctrl+a ? → searchable guide
#
#  Sessions are created by hand: terminal / Ctrl+a s / Ctrl+a N.
#  Everything that loses something asks first with a small menu: click an answer,
#  or press its key (y / n, or ↑↓ and Enter), Esc cancels. Mouse and keyboard both work.
#
#  ~/.tmux.conf loads this file (./install.sh adds those lines at its end):
#    TERMINAL_SETUP="<this repo>"
#    source-file "$TERMINAL_SETUP/tmux/tmux.conf"
#  $TERMINAL_SETUP finds the scripts in the repo. ~/.tmux keeps what is yours: plugins, logs…
#  Colors: Catppuccin Mocha. Icons need a Nerd Font (set in Windows Terminal).
# ═══════════════════════════════════════════════════════════════

# ═══════════════ Prefix ═══════════════
unbind C-b
set -g prefix C-a
bind -N "Send Ctrl+a to the app (start of line in the shell)" C-a send-prefix

# ═══════════════ Basics ═══════════════
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10               # 0 can split arrow keys into Esc + [ ; 10ms is still instant
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g display-time 2000
set -g repeat-time 400               # window to keep tapping a repeatable key (-r) after the prefix
setw -g aggressive-resize on
set -g detach-on-destroy off         # closing a session jumps to another one instead of leaving tmux
set -g exit-empty off                # server survives with 0 sessions (lets auto-restore run on start)
set -g set-titles on                 # Windows Terminal tab title = session · window
set -g set-titles-string "#S · #W"
# Clipboard: every copy (keyboard, mouse or menu) goes to the Windows clipboard through
# OSC 52, which Windows Terminal supports. No copy-command needed (pbcopy is macOS-only).
set -s set-clipboard on

# ═══════════════ Sessions ═══════════════
bind -N "Session picker" s display-popup -E -w 75% -h 70% -b rounded -S "fg=#89b4fa" -d "#{pane_current_path}" \
  -T "#[align=centre,fg=#89b4fa,bold] sessions " "$TERMINAL_SETUP/tmux/terminal.zsh pick"
# Session tree: sessions with their tabs unfolded (→ / ← fold), live preview below
set -g @tree-format "#{?pane_format,#[fg=#cdd6f4]#{pane_current_command}#[fg=#6c7086]  #{s|^#{HOME}|~|:pane_current_path}#{?pane_active,  #[fg=#89b4fa]● active,},#{?window_format,#{E:@tab-icon} #[fg=#cdd6f4]#{window_name}#[fg=#6c7086]#{?#{>:#{window_panes},1},  󰕰 #{window_panes} panes,}#{?window_active,  #[fg=#89b4fa]● current,},#{?#{@description},#[fg=#cdd6f4]#{@description}#[fg=#6c7086] · ,}#[fg=#6c7086]#{session_windows} #{?#{==:#{session_windows},1},tab,tabs} · #{s|^#{HOME}|~|:session_path}#{?session_attached,  #[fg=#a6e3a1]● open,}}}"
# System monitor: the `system` session (tmux/system.sh) is always there
bind -N "Go to the system monitor (info · processes & ports · packages · docker)" M run-shell -b "$TERMINAL_SETUP/tmux/system.sh go '#{client_name}'"
set-hook -g session-closed 'run-shell -b "$TERMINAL_SETUP/tmux/system.sh ensure"'
# a pane or a tab of it was closed (Ctrl+a x, exit…): it comes back by itself
set-hook -g window-layout-changed[1] 'if -F "#{==:#{session_name},system}" { run-shell -b "$TERMINAL_SETUP/tmux/system.sh repair" }'
set-hook -g window-unlinked 'if -F "#{==:#{session_name},system}" { run-shell -b "$TERMINAL_SETUP/tmux/system.sh repair" }'
bind -N "Session tree with live previews" S choose-tree -Zw -F "#{E:@tree-format}"
bind -N "Jump to previous session" BTab switch-client -l
bind -N "New session in this folder" N command-prompt -p "New session name:" \
  { new-session -s "%%" -c "#{pane_current_path}" }
bind -N "Close this session (asks first, then pick another) · restarts the system monitor" X \
  if -F "#{==:#{session_name},system}" \
    { display-menu -M -O -T "#[align=centre,fg=#f38ba8,bold] the system monitor is always there " -x C -y C -- \
        "󰑐  Restart it" y { run-shell -b "$TERMINAL_SETUP/tmux/system.sh restart" } "" "󰜺  Cancel" n "" } \
    { display-menu -M -O -T "#[align=centre,fg=#f38ba8,bold] close session #S? " -x C -y C -- \
        "󰅖  Close it and its #{session_windows} tab(s)" y { kill-session ; run -d 0.2 -C "send-keys -K -c '#{client_name}' C-a s" } "" "󰜺  Cancel" n "" }

# ═══════════════ Windows (tabs) ═══════════════
bind -N "New window in this folder" c new-window -c "#{pane_current_path}"
bind -N "New window with a name" C command-prompt -p "Window name:" \
  { new-window -n "%%" -c "#{pane_current_path}" }
bind -N "Jump to previous window" Tab last-window
# (the tab menu and a middle-click on a tab replay this key)
bind -N "Close window (asks first)" & \
  if -F "#{==:#{session_windows},1}" \
    { display-menu -M -O -T "#[align=centre,fg=#f38ba8,bold] last tab of session #S " -x C -y C -- \
        "󰅖  Close it · the session closes too" y { kill-window ; run -d 0.2 -C "send-keys -K -c '#{client_name}' C-a s" } "" "󰜺  Cancel" n "" } \
    { display-menu -M -O -T "#[align=centre,fg=#f38ba8,bold] close tab #I · #W? " -x C -y C -- \
        "󰅖  Close it#{?#{>:#{window_panes},1}, and its #{window_panes} panes,}" y { kill-window } "" "󰜺  Cancel" n "" }
bind -N "Move window left"  -r < swap-window -d -t :-1
bind -N "Move window right" -r > swap-window -d -t :+1
# Shift+←/→ change window, except in editors that use them to select text (micro, vim…)
bind -n S-Left  if -F "#{m/r:^(micro|n?vim?|nano|emacs)$,#{pane_current_command}}" { send-keys S-Left }  { previous-window }
bind -n S-Right if -F "#{m/r:^(micro|n?vim?|nano|emacs)$,#{pane_current_command}}" { send-keys S-Right } { next-window }

# ═══════════════ Panes ═══════════════
bind -N "Split side by side" v split-window -h -c "#{pane_current_path}"
bind -N "Split below" - split-window -v -c "#{pane_current_path}"
bind -N "Split side by side" | split-window -h -c "#{pane_current_path}"

bind -N "Pane left"  h select-pane -L
bind -N "Pane down"  j select-pane -D
bind -N "Pane up"    k select-pane -U
bind -N "Pane right" l select-pane -R
bind -N "Pane left (repeatable)"  -r Left  select-pane -L
bind -N "Pane down (repeatable)"  -r Down  select-pane -D
bind -N "Pane up (repeatable)"    -r Up    select-pane -U
bind -N "Pane right (repeatable)" -r Right select-pane -R

bind -N "Resize left"  -r H resize-pane -L 5
bind -N "Resize down"  -r J resize-pane -D 5
bind -N "Resize up"    -r K resize-pane -U 5
bind -N "Resize right" -r L resize-pane -R 5

# Closing a pane asks first when that loses something: the last pane of a session closes
# the session, and a program still running (micro, ssh, a dev server…) would be killed.
# A pane at its shell prompt just closes. The pane menu and the quick menu replay this key.
bind -N "Close pane (asks if a program is running in it, or it is the last one of the session)" x \
  if -F "#{&&:#{==:#{session_windows},1},#{==:#{window_panes},1}}" \
    { display-menu -M -O -T "#[align=centre,fg=#f38ba8,bold] last pane of session #S " -x C -y C -- \
        "󰅖  Close it · the session closes too" y { kill-pane ; run -d 0.2 -C "send-keys -K -c '#{client_name}' C-a s" } "" "󰜺  Cancel" n "" } \
    { if -F "#{m/r:^(zsh|bash|sh|fish)$,#{pane_current_command}}" { kill-pane } \
        { display-menu -M -O -T "#[align=centre,fg=#f38ba8,bold] #{pane_current_command} is still running here " -x C -y C -- \
            "󰅖  Close the pane anyway" y { kill-pane } "" "󰜺  Cancel" n "" } }
bind -N "Move pane to its own window" b break-pane
bind -N "Bring a window in as a pane" m command-prompt -p "Join window number:" { join-pane -h -s ":%%" }
bind -N "Type in all panes at once (toggle)" a setw synchronize-panes

# ═══════════════ Copy mode ═══════════════
# Every copy ends with a short "copied" toast so you know it reached the clipboard.
setw -g mode-keys vi
# Double-click / "Copy word" take whole paths, URLs and hyphenated names
# (tmux's default also splits on - / . : and more)
set -g word-separators " \"'`()[]{}<>,;|"
bind -N "Copy mode" y copy-mode
bind -N "Copy mode" Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi r send -X rectangle-toggle   # Windows Terminal keeps Ctrl+V for paste
bind -T copy-mode-vi y if -F "#{selection_present}" \
  { send -X copy-pipe-and-cancel ; display -d 1200 " 󰆏  copied to the clipboard" } { send -X cancel }
# A plain click often arrives with a tiny drag on the same cell: that is not a selection.
# Only copy when the selection spans more than one cell; otherwise just drop it (and leave
# copy mode unless you had scrolled back, so a click while reading keeps your place).
bind -T copy-mode-vi MouseDragEnd1Pane if -F "#{||:#{!=:#{selection_start_x},#{selection_end_x}},#{!=:#{selection_start_y},#{selection_end_y}}}" \
  { send -X copy-pipe-and-cancel ; display -d 1200 " 󰆏  copied to the clipboard" } \
  { if -F "#{scroll_position}" { send -X clear-selection } { send -X cancel } }
bind -T copy-mode-vi Escape if -F "#{selection_present}" { send -X clear-selection } { send -X cancel }

# ═══════════════ Quick menu, guide & reload ═══════════════
# Quick menu: defined in tmux/quick-menu.zsh so it can be reopened when the terminal is resized
bind -N "Quick menu" Space run-shell -b "$TERMINAL_SETUP/tmux/quick-menu.zsh '#{client_name}'"
set-hook -g client-resized {
  if -F "#{m:#{client_name}:*,#{@quick-menu}}" {
    run -C "send-keys -K -c '#{client_name}' Escape"
    run -d 0.15 -C "send-keys -K -c '#{client_name}' C-a Space"
  }
}

bind -N "Guide" ? display-popup -E -w 80% -h 85% -b rounded -S "fg=#89b4fa" \
  -T "#[align=centre,fg=#89b4fa,bold] tmux guide " "$TERMINAL_SETUP/tmux/guide.zsh"
bind -N "Guide" g display-popup -E -w 80% -h 85% -b rounded -S "fg=#89b4fa" \
  -T "#[align=centre,fg=#89b4fa,bold] tmux guide " "$TERMINAL_SETUP/tmux/guide.zsh"
bind -N "Reload config" r source-file ~/.tmux.conf \; display-message "config reloaded"

# ═══════════════ Mouse ═══════════════
# Status bar items wrapped in #[range=user|KEY] are buttons: a click replays
# Ctrl+a KEY, so a button always does exactly what its shortcut does.
# Tabs: click select · middle-click close · right-click menu · wheel switch.
# Empty part of the bar: double-click new tab · right-click quick menu.
bind -n MouseDown1Status if -F "#{m/r:^(window|left|right|session)?$,#{mouse_status_range}}" \
  { switch-client -t = } \
  { run -C "send-keys -K -c '#{client_name}' C-a '#{mouse_status_range}'" }
# on release: the question it asks would close at once if the button came up after it opened
unbind -n MouseDown2Status
bind -n MouseUp2Status if -F "#{==:#{mouse_status_range},window}" \
  { select-window -t = ; run -C "send-keys -K -c '#{client_name}' C-a &" }
# System monitor: double-click fastfetch, Resources or btop to zoom it, again to restore
# (the interactive panes have their own 󰊓 zoom button). Everywhere else a double-click keeps
# tmux's default: copy the word under the pointer. (tmux sends no mouse events for the
# label row on a pane border, so that row cannot be used.)
# Info and Resources draw a "󰊓 zoom / 󰊔 restore" button in their top-right corner; they do
# not read the mouse themselves, so tmux checks where the click landed (row 0, last 12 cols).
bind -n MouseDown1Pane if -F "#{&&:#{==:#{session_name},system},#{&&:#{!:#{mouse_any_flag}},#{&&:#{==:#{mouse_y},0},#{e|>=:#{mouse_x},#{e|-:#{pane_width},12}}}}}" \
  { select-pane -t = ; resize-pane -Z -t = } \
  { select-pane -t = ; send-keys -M }
bind -n DoubleClick1Pane if -F "#{&&:#{==:#{session_name},system},#{||:#{!:#{mouse_any_flag}},#{==:#{@label},btop}}}" \
  { select-pane -t = ; resize-pane -Z -t = } \
  { select-pane -t = ; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel } }
# Clicks on the bar outside any item arrive as *StatusDefault (or *StatusRight on the clock)
bind -n DoubleClick1StatusDefault new-window -c "#{pane_current_path}"
bind -n MouseDown3StatusDefault run -C "send-keys -K -c '#{client_name}' C-a Space"
bind -n MouseDown3StatusRight   run -C "send-keys -K -c '#{client_name}' C-a Space"
# Wheel anywhere on the bar (also over the ◀ ▶ markers) changes tab
bind -n WheelUpStatusDefault   previous-window
bind -n WheelDownStatusDefault next-window

bind -n MouseDown3Status if -F "#{==:#{mouse_status_range},window}" {
  display-menu -O -T "#[align=centre,fg=#89b4fa,bold] tab #{window_index} · #{window_name} " -t = -x W -y W -- \
    "󰏫  Rename tab"                     n { command-prompt -F -I "#W" -p "Tab name:" { rename-window -t "#{window_id}" "%%" } } \
    "󰝜  New tab after this one"         c { new-window -a -c "#{pane_current_path}" } \
    "" \
    "#{?#{>:#{session_windows},1},,-}󰁍  Move left"  < { swap-window -t :-1 } \
    "#{?#{>:#{session_windows},1},,-}󰁔  Move right" > { swap-window -t :+1 } \
    "󰡌  Split side by side"             v { split-window -h -c "#{pane_current_path}" } \
    "󰡋  Split below"                    - { split-window -v -c "#{pane_current_path}" } \
    "#{?#{>:#{window_panes},1},,-}󰕵  Next layout" l { next-layout } \
    "" \
    "󰅖  Close tab…"                     X { select-window -t "#{window_id}" ; run -C "send-keys -K -c '#{client_name}' C-a &" }
} {
  if -F "#{==:#{mouse_status_range},s}" {
    display-menu -O -T "#[align=centre,fg=#89b4fa,bold] session #{session_name} " -t = -x M -y W -- \
      "󰉹  Switch session…"              s { run -C "send-keys -K -c '#{client_name}' C-a s" } \
      "󰙅  Session tree"                 S { run -C "send-keys -K -c '#{client_name}' C-a S" } \
      "󰐕  New session…"                 N { command-prompt -p "New session name:" { new-session -s "%%" -c "#{pane_current_path}" } } \
      "󰏫  Rename session"               $ { command-prompt -I "#S" -p "Session name:" { rename-session "%%" } } \
      "" \
      "󰈆  Detach (keeps running)"       d { detach-client } \
      "#{?#{==:#{session_name},system},󰑐  Restart the monitor…,󰅖  Close session…}"  X { run -C "send-keys -K -c '#{client_name}' C-a X" }
  } {
    run -C "send-keys -K -c '#{client_name}' C-a Space"
  }
}

# Right-click a pane. Apps that use the mouse themselves (micro, htop…) still get
# the click; Alt+right-click forces tmux's native menu there.
bind -n MouseDown3Pane if -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" \
  { select-pane -t = ; send -M } {
  select-pane -t =
  display-menu -O -T "#[align=centre,fg=#89b4fa,bold] pane #{pane_index} · #{pane_current_command} " -t = -x M -y M -- \
    "#{?mouse_word,󰆏  Copy #[underscore]#{=/24/…:mouse_word},}"   c { copy-mode -q ; set-buffer -w -- "#{q:mouse_word}" ; display -d 1200 " 󰆏  copied to the clipboard" } \
    "#{?mouse_line,󰆏  Copy this line,}"                         l { copy-mode -q ; set-buffer -w -- "#{q:mouse_line}" ; display -d 1200 " 󰆏  copied to the clipboard" } \
    "#{?mouse_hyperlink,󰌷  Copy link,}"                         h { copy-mode -q ; set-buffer -w -- "#{q:mouse_hyperlink}" ; display -d 1200 " 󰆏  copied to the clipboard" } \
    "#{?buffer_size,,-}󰆒  Paste last copy"      p { paste-buffer -p } \
    "󰍉  Extract text…"                                 e { run -C "send-keys -K -c '#{client_name}' C-a e" } \
    "󰌷  Open a link…"                                  u { run -C "send-keys -K -c '#{client_name}' C-a u" } \
    "󰯔  Scroll & select text"                                  y { copy-mode } \
    "" \
    "󰡌  Split side by side"                                 v { split-window -h -c "#{pane_current_path}" } \
    "󰡋  Split below"                                        - { split-window -v -c "#{pane_current_path}" } \
    "#{?#{>:#{window_panes},1},,-}󰊓  #{?window_zoomed_flag,Unzoom,Zoom}"  z { resize-pane -Z } \
    "#{?#{>:#{window_panes},1},,-}󰓡  Swap with next pane"      > { swap-pane -D } \
    "#{?#{>:#{window_panes},1},,-}󰏌  Move to its own tab"      b { break-pane } \
    "#{?#{>:#{window_panes},1},,-}󰓦  #{?pane_synchronized,Stop typing in all panes,Type in all panes}" a { setw synchronize-panes } \
    "" \
    "#{?pane_pipe,󰓛  Stop logging this pane,󰑊  Log this pane to ~/.tmux/logs}"  P { run-shell "~/.tmux/plugins/tmux-logging/scripts/toggle_logging.sh" ; refresh-client -S } \
    "󰆓  Save the whole history to a file"            H { run-shell "~/.tmux/plugins/tmux-logging/scripts/save_complete_history.sh" } \
    "#{?#{m/r:^(zsh|bash|sh|fish)$,#{pane_current_command}},-,}󰩺  Kill the stuck program…" * { run -C "send-keys -K -c '#{client_name}' C-a *" } \
    "#{?history_size,,-}󰃢  Clear scrollback…"                 k { run -C "send-keys -K -c '#{client_name}' C-a M-c" } \
    "󰅖  Close pane"                                         x { run -C "send-keys -K -c '#{client_name}' C-a x" }
}

# ═══════════════ Theme ═══════════════
# Catppuccin Mocha · crust #11111b · surface0 #313244 · overlay0 #6c7086 · text #cdd6f4
# Accent: blue #89b4fa (current tab, borders, menus, popups) · red #f38ba8 (Ctrl+a pressed, closing)
#          yellow #f9e2af (copy mode) · teal #94e2d5 (tree mode) · peach #fab387 (all panes)

# Mode color of the session pill and the key hints
set -g @mode-color "#{?client_prefix,#f38ba8,#{?#{&&:#{m/r:(copy|view)-mode,#{pane_mode}},#{selection_present}},#f9e2af,#{?#{m/r:(copy|view)-mode,#{pane_mode}},#89b4fa,#{?pane_in_mode,#94e2d5,#{?pane_synchronized,#fab387,#89b4fa}}}}}"
set -g @mode-icon  "#{?client_prefix,󰌌,#{?#{&&:#{m/r:(copy|view)-mode,#{pane_mode}},#{selection_present}},󰆏,#{?#{m/r:(copy|view)-mode,#{pane_mode}},↕,#{?pane_in_mode,󰙅,}}}}"

# Tab icon from the running program (folder icon for a plain shell)
# A tab can set its own icon with the window option @icon (the system monitor does)
set -g @tab-icon "#{?#{@icon},#{@icon},#{?#{m/r:^(zsh|bash|sh|fish)$,#{pane_current_command}},󰉋,#{?#{m/r:^(micro|n?vim?|nano|emacs)$,#{pane_current_command}},,#{?#{m/r:^(docker|lazydocker)$,#{pane_current_command}},,#{?#{m/r:^python,#{pane_current_command}},,#{?#{m/r:^(node|npm|npx|pnpm|yarn|bun)$,#{pane_current_command}},,#{?#{m/r:^(git|lazygit|tig)$,#{pane_current_command}},,#{?#{m/r:^(btop|htop|top)$,#{pane_current_command}},󰐰,#{?#{m/r:^ssh$,#{pane_current_command}},󰣀,#{?#{m/r:^(claude|codex)$,#{pane_current_command}},󰚩,}}}}}}}}}}"

set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"
set -g status on

# ─── Line 1 ─── session pill (click: picker · right-click: session menu)
set -g status-left-length 60
set -g status-left "#[range=user|s]#[fg=#{E:@mode-color},bg=default]#[fg=#11111b,bg=#{E:@mode-color},bold]#{E:@mode-icon} #S#[fg=#{E:@mode-color},bg=default,nobold]#[norange] #{?#{E:@tabs-overflow},#[range=user|p]#[fg=#89b4fa]#[bold]◀ #[nobold]#[norange],} "

# Tabs: two-tone pills [number][icon name] · 󰕰 N = panes in the tab · 󰊓 zoomed
# A  button follows the last tab (no commas inside #{?…} branches: they split them)
setw -g window-status-separator " "
setw -g window-status-activity-style default
setw -g window-status-bell-style default
# Every tab gets an equal share of the width the two sides leave free, so names are cut
# to fit (3–20 chars + "…"). The 󰕰 N panes badge only shows when there is room to spare.
# Only when even 3 chars do not fit, clickable ◀ ▶ appear beside the tabs (they switch
# tab; the wheel on the bar does too).
# @bar-reserve: the session pill + the right side (stats, buttons, clock; the Ctrl+a key
# hints from 140 cols, the date from 150) · a tab without its name takes 9 cells (10 with
# the "…" of a cut name), 4 more with the badge
set -g @bar-reserve   "#{e|+:#{n:#{session_name}},#{?#{e|>=:#{client_width},160},88,#{?#{e|>=:#{client_width},140},68,42}}}"
set -g @tab-room0     "#{e|-:#{e|/:#{e|-:#{client_width},#{E:@bar-reserve}},#{session_windows}},10}"
set -g @tab-badges    "#{e|>=:#{E:@tab-room0},12}"
set -g @tab-room      "#{?#{E:@tab-badges},#{e|-:#{E:@tab-room0},4},#{E:@tab-room0}}"
set -g @tab-name      "#{=/#{?#{e|<:#{E:@tab-room},3},3,#{?#{e|>:#{E:@tab-room},20},20,#{E:@tab-room}}}/…:window_name}"
set -g @tabs-overflow "#{e|<:#{E:@tab-room},3}"
setw -g window-status-format         "#[fg=#45475a,bg=default]#[fg=#bac2de,bg=#45475a]#I #[fg=#a6adc8,bg=#313244] #{E:@tab-icon} #{E:@tab-name}#{?window_zoomed_flag, 󰊓,}#{?#{&&:#{E:@tab-badges},#{>:#{window_panes},1}}, 󰕰 #{window_panes},}#{?window_bell_flag, #[fg=#f38ba8]󰂞,} #[fg=#313244,bg=default]#{?loop_last_flag,#[norange]  #[range=user|c]#[fg=#313244]#[fg=#a6adc8]#[bg=#313244]#[fg=#313244]#[bg=default]#[norange],}"
setw -g window-status-current-format "#[fg=#89b4fa,bg=default]#[fg=#11111b,bg=#89b4fa,bold]#I #[fg=#cdd6f4,bg=#45475a] #{E:@tab-icon} #{E:@tab-name}#{?window_zoomed_flag, 󰊓,}#{?#{&&:#{E:@tab-badges},#{>:#{window_panes},1}}, 󰕰 #{window_panes},}#{?window_bell_flag, #[fg=#f38ba8]󰂞,} #[fg=#45475a,bg=default,nobold]#{?loop_last_flag,#[norange]  #[range=user|c]#[fg=#313244]#[fg=#a6adc8]#[bg=#313244]#[fg=#313244]#[bg=default]#[norange],}"

# Right: key hints (Ctrl+a / copy / tree mode) · badges · 󰍜 menu │ 󰋖 guide buttons with their keys · date · clock
set -g status-right-length 160
# Key hints shown left of the buttons only while they matter
set -g @hint-prefix "#[fg=#f38ba8,bold]󰌌 press a key #[fg=#6c7086,nobold]· ? all keys  "
# Scrolling with the wheel uses tmux's copy mode underneath, but it only looks like "copy"
# once something is selected (more than one cell, see MouseDragEnd1Pane).
set -g @scroll-info "↑ #{scroll_position} lines · #{?history_size,#{e|/:#{e|*:#{e|-:#{history_size},#{scroll_position}},100},#{history_size}},100}%"
set -g @hint-scroll "#[fg=#89b4fa,bold]↕ #{?history_size,#{e|/:#{e|*:#{e|-:#{history_size},#{scroll_position}},100},#{history_size}},100}%  #[fg=#7f849c,nobold]drag selects · #[fg=#89b4fa,bold]q#[fg=#7f849c,nobold] back   "
set -g @hint-copy   "#[fg=#f9e2af,bold]󰆏 COPY  #[fg=#f9e2af,bold]y#[fg=#7f849c,nobold] copy  #[fg=#f9e2af,bold]/#[fg=#7f849c,nobold] search  #[fg=#f9e2af,bold]q#[fg=#7f849c,nobold] exit   "
set -g @hint-tree   "#[fg=#94e2d5,bold]󰙅 Enter#[fg=#7f849c,nobold] open  #[fg=#94e2d5,bold]x#[fg=#7f849c,nobold] kill  #[fg=#94e2d5,bold]C-s#[fg=#7f849c,nobold] search  #[fg=#94e2d5,bold]q#[fg=#7f849c,nobold] exit   "
# tmux's default line 1; only the overflow markers changed (a dim …, the ◀ ▶ buttons live in status-left/right)
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]#[fg=#6c7086]…#[list=right-marker]#[fg=#6c7086]…#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-right "#{?#{E:@tabs-overflow},#[range=user|n]#[fg=#89b4fa]#[bold] ▶#[nobold]#[norange],}  #{?pane_pipe,#[fg=#f38ba8]#[bold]● REC #[nobold] ,}#[range=user|M]#($TERMINAL_SETUP/tmux/system/stats.sh)#[norange]  #{?client_prefix,#{E:@hint-prefix},#{?#{&&:#{m/r:(copy|view)-mode,#{pane_mode}},#{selection_present}},#{E:@hint-copy},#{?#{m/r:(copy|view)-mode,#{pane_mode}},#{E:@hint-scroll},#{?pane_in_mode,#{E:@hint-tree},}}}}#{?pane_synchronized,#[fg=#fab387]#[bold]󰓦 ALL PANES #[nobold] ,}#{?#{&&:#{window_zoomed_flag},#{!:#{pane_in_mode}}},#[range=user|z]#[fg=#11111b]#[bg=#89b4fa]#[bold] 󰊔 ZOOM · restore #[nobold]#[bg=default]#[norange]  ,}#[fg=#313244,bg=default]#[range=user|Space]#[fg=#cdd6f4,bg=#313244]󰍜#{?#{e|>=:#{client_width},160}, menu,} #{?#{e|>=:#{client_width},140},#[fg=#{?client_prefix,#f38ba8,#89b4fa}]#[bold]Ctrl+a ␣#[nobold] ,}#[norange]#[fg=#585b70]│#[range=user|?]#[fg=#cdd6f4] 󰋖#{?#{e|>=:#{client_width},160}, guide,} #{?#{e|>=:#{client_width},140},#[fg=#{?client_prefix,#f38ba8,#89b4fa}]#[bold]Ctrl+a ?#[nobold],}#[norange]#[fg=#313244,bg=default]  #{?#{e|>:#{client_width},150},#[fg=#7f849c]%a %d %b  ,}#[fg=#89b4fa]#[fg=#11111b,bg=#89b4fa,bold]󰥔 %H:%M#[fg=#89b4fa,bg=default,nobold]"


# Automatic tab names: folder name in a shell, program name otherwise
setw -g automatic-rename on
set -g automatic-rename-format "#{?#{m/r:^(zsh|bash|sh|fish)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}"

# Borders and pane labels (only shown when a window has 2+ panes)
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-format "#{?pane_active,#[fg=#89b4fa]#[bold],#[fg=#6c7086]} #{?#{@label},#{@label},#{?#{m/r:^(zsh|bash|sh|fish)$,#{pane_current_command}},#{s|^#{HOME}|~|:pane_current_path},#{pane_current_command}}} #[nobold]#{?#{m/r:(copy|view)-mode,#{pane_mode}},#[fg=#89b4fa]↕ #{E:@scroll-info} ,}#{?pane_pipe,#[fg=#f38ba8]● REC ,}#{?#{&&:#{==:#{@label},btop},#{!:#{window_zoomed_flag}}},#[fg=#6c7086]· double-click to zoom ,}"
set-hook -g window-layout-changed[0] 'set -wF pane-border-status "#{?#{>:#{window_panes},1},top,off}"'

# No pane scrollbars: tmux 3.6 draws them one row too high when the status bar is at the
# top (over the pane border). The scroll position shows on the pane label and top right.
set -g pane-scrollbars off

# Messages, prompts, menus, popups, selections
set -g message-style "bg=#89b4fa,fg=#11111b,bold"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g menu-style "bg=default,fg=#cdd6f4"
set -g menu-selected-style "bg=#89b4fa,fg=#11111b,bold"
set -g menu-border-style "fg=#89b4fa"
set -g menu-border-lines rounded
set -g popup-border-style "fg=#89b4fa"
set -g popup-border-lines rounded
set -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g copy-mode-match-style "bg=#45475a,fg=#f9e2af"
set -g copy-mode-current-match-style "bg=#f9e2af,fg=#11111b,bold"
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#6c7086"
set -g clock-mode-colour "#89b4fa"

# ═══════════════ Plugins & auto-save ═══════════════
# Ctrl+a I install · Ctrl+a U update · Ctrl+a Ctrl+s save · Ctrl+a Ctrl+r restore
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-cowboy'
set -g @plugin 'b0o/tmux-autoreload'

# tmux-logging · Ctrl+a P start/stop logging this pane · Alt+p save what is on screen
#   · Alt+P save the whole history · Alt+c clear the history. Files go to ~/.tmux/logs
set -g @logging-path "$HOME/.tmux/logs"
set -g @screen-capture-path "$HOME/.tmux/logs"
set -g @save-complete-history-path "$HOME/.tmux/logs"

# tmux-autoreload · saving ~/.tmux.conf reloads it (needs `entr`: sudo apt install entr)
set -g @tmux-autoreload-configs "$TERMINAL_SETUP/tmux/tmux.conf"   # this file: ~/.tmux.conf only sources it
set -g @tmux-autoreload-entrypoints 1
set -g @tmux-autoreload-quiet 0           # declared so the plugin's lookup does not log "invalid option"

# extrakto · Ctrl+a e: fuzzy-pick any word, path, URL or line on screen
#   Enter types it at the prompt · Ctrl+y copies it · Ctrl+f cycles word/path/url/line
set -g @extrakto_key 'none'                  # bound below with a description
set -g @extrakto_split_direction 'p'         # always a popup
set -g @extrakto_popup_size '80%,60%'
set -g @extrakto_fzf_layout 'reverse'
set -g @extrakto_insert_key 'enter'
set -g @extrakto_copy_key 'ctrl-y'
set -g @extrakto_clip_mode 'tmux_osc52'      # same clipboard path as the rest (OSC 52)
set -g @extrakto_open_tool "$TERMINAL_SETUP/tmux/system/open.sh"   # the desktop's app, on every system
set -g @extrakto_editor 'micro'
set -g @extrakto_fzf_header 'i c f g h'
bind -N "Extract text from the screen (extrakto)" e run-shell "~/.tmux/plugins/extrakto/scripts/open.sh '#{pane_id}'"

# tmux-fzf-url · Ctrl+a u: list the URLs on screen, Enter opens them in the browser
#   Tab marks several · Ctrl+y copies. tmux/system/open.sh picks the browser of each
#   system (Windows' one in WSL)
set -g @fzf-url-bind 'u'
set -g @fzf-url-open "$TERMINAL_SETUP/tmux/system/open.sh"
set -g @fzf-url-copy-cmd 'tmux load-buffer -w -'
set -g @fzf-url-history-limit '2000'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'micro'  # also reopen micro (on top of resurrect's default list)
set -g @resurrect-hook-post-save-layout '$TERMINAL_SETUP/tmux/system/resurrect-filter.sh'  # `system` is rebuilt, never restored
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# WSL stops the distro (and tmux with it) a little after the last Windows
# Terminal tab closes, so also save whenever a client goes away. Skipped with
# 0 sessions left, so it never overwrites the last save with an empty one.
set-hook -g client-detached 'if -F "#{>:#{server_sessions},0}" { run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet" }'

# tmux-autoreload watchers left by servers that are gone (after kill-server) go away
run-shell -b '$TERMINAL_SETUP/tmux/system/autoreload-reap.sh'

# Keep last: tpm needs the options above (continuum hooks into status-right)
run '~/.tmux/plugins/tpm/tpm'

# Plugin keys again, after tpm loaded them: same actions, with descriptions for the
# guide / Ctrl+a /, and tmux-cowboy asks before killing anything.
run-shell -b "$TERMINAL_SETUP/tmux/system.sh ensure"

bind -N "Start / stop logging this pane to ~/.tmux/logs" P run-shell "~/.tmux/plugins/tmux-logging/scripts/toggle_logging.sh" \; refresh-client -S
bind -N "Save what is on screen to ~/.tmux/logs" M-p run-shell "~/.tmux/plugins/tmux-logging/scripts/screen_capture.sh"
bind -N "Save the whole history to ~/.tmux/logs" M-P run-shell "~/.tmux/plugins/tmux-logging/scripts/save_complete_history.sh"
# Clearing the history cannot be undone: it says how many lines go and asks first, and can
# save them first (the pane menu's "Clear scrollback…" replays this key)
bind -N "Clear the pane history (asks first)" M-c \
  if -F "#{==:#{history_size},0}" { display "nothing to clear: this pane has no history" } \
    { display-menu -M -O -T "#[align=centre,fg=#f38ba8,bold] clear #{history_size} lines of history? " -x C -y C -- \
        "󰃢  Clear them" y { clear-history ; display "pane history cleared" } \
        "󰆓  Save them to ~/.tmux/logs, then clear" s { run-shell "~/.tmux/plugins/tmux-logging/scripts/save_complete_history.sh" ; clear-history ; display "saved to ~/.tmux/logs · pane history cleared" } \
        "" "󰜺  Cancel" n "" }
# (the pane menu's "Kill the stuck program…" replays this key)
bind -N "Kill the stuck program in this pane (kill -9, asks first)" * \
  if -F "#{m/r:^(zsh|bash|sh|fish)$,#{pane_current_command}}" { display "nothing running in this pane" } \
    { display-menu -M -O -T "#[align=centre,fg=#f38ba8,bold] kill -9 #{pane_current_command}? " -x C -y C -- \
        "󰩺  Kill it · unsaved work in it is lost" y { run-shell "~/.tmux/plugins/tmux-cowboy/scripts/kill.sh KILL" } "" "󰜺  Cancel" n "" }
